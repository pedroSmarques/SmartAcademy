<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART ACADEMY - CADASTRO ALUNOS</title>
    <link rel="stylesheet" href="styles/cadastroAluno.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap">
    <link rel="shortcut icon" href="assets/faviconE.png" type="image/x-icon">
</head>

<body>
    <header>
        <img src="assets/academia.png" alt="Logo Smart Academy">
        <h4>
            Mais saúde, mais resultado!
        </h4>
        <a href="index.html">Voltar</a>
    </header>
    <main>
        <div id="containerCentral">
            <h1>Cadastrar Aluno</h1>
            <form action="php/cadastroAluno.php" method="post">
                <div class="campos">
                    <label for="nome">Nome</label>
                    <input type="text" name="nome" id="nome" placeholder="Nome completo" autocomplete="name">
                </div>
                <div class="campos">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="nome@email.com" autocomplete="email">
                </div>
                <div class="campos">
                    <label for="telefone">Telefone</label>
                    <input type="tel" name="telefone" id="telefone" placeholder="(00) 00000-0000" autocomplete="tel">
                </div>
                <div class="campos">
                    <label for="cpf">CPF</label>
                    <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00" inputmode="numeric">
                </div>

                <button type="submit" name="submit">Cadastrar</button>
                <button type="reset">Limpar</button>
            </form>
        </div>
    </main>
    <footer>
        <p>Smart Academy</p>
        &copy; TODOS OS DIREITOS RESERVADOS
    </footer>
</body>
<script src="scripts/cadastroAluno.js"></script>
</html>
