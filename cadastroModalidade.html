<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART ACADEMY - CADASTRO MODALIDADE</title>
    <link rel="stylesheet" href="styles/cadastroModalidade.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap">
    <link rel="shortcut icon" href="assets/faviconE.png" type="image/x-icon">
</head>

<body>
    <header>
        <img src="assets/academia.png" alt="Logo Smart Academy">
        <h4>
            Mais saúde, mais resultado!
        </h4>
        <a href="index.html">Voltar</a>
    </header>
    <main>
        <div id="containerGeral">
            <h1>Cadastrar Modalidade</h1>
            <form action="php/cadastroModalidade.php" method="post">
                <div class="campos">
                    <label for="nomemodalidade">Nome da Modalidade</label>
                    <input type="text" name="nomeModalidade" id="nomeModalidade" placeholder="Ex.: Musculação">
                </div>
                <div class="campos">
                    <label for="mensalidade">Mensalidade</label>
                    <input type="number" name="mensalidade" id="mensalidade" placeholder="0,00" min="0" step="0.01">
                </div>
                <div class="campos">
                    <label for="local">Local</label>
                    <input type="text" name="local" id="local" placeholder="Ex.: Sala 2">
                </div>
                <div class="campos">
                    <label for="indicacao">Indicação</label>
                    <input type="text" name="indicacao" id="indicacao" placeholder="Ex.: Iniciantes">
                </div>
                <div class="campos">
                    <label for="restricao">Restrição</label>
                    <input type="text" name="restricao" id="restricao" placeholder="Ex.: Atestado médico">
                </div>

                <button type="submit" name="submit">Cadastrar</button>
                <button type="reset">Limpar</button>
            </form>
        </div>
    </main>
    <footer>
        <p>Smart Academy</p>
        &copy; TODOS OS DIREITOS RESERVADOS
    </footer>
</body>

</html>
